<title id="real-place-pipeline-title">Real-place pipeline</title>
<desc id="real-place-pipeline-desc">How a real place becomes a terrain in the playground: the Map popover gives a bounding box, the region hook sends it to the playground worker, and the worker calls the library's topographic/locations. A named place loads its built-in 16-bit grid with loadLocation(). Any other area goes through fetchLocation(), which fetches and decodes Terrarium elevation tiles, stitches and resamples them to a 256 by 256 grid, scales the relief and smooths it. The hook hands the heightfield to the renderer with setHeightfield().</desc>
