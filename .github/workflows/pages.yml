name: pages

# The playground moved to https://topographic.yahyapak.dev.
# This keeps old GitHub Pages links working by redirecting them there,
# keeping the path and the query string.

on:
  push:
    branches: [main]
    paths: [.github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write redirect pages
        run: |
          mkdir site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <title>topographic has moved</title>
              <link rel="canonical" href="https://topographic.yahyapak.dev/" />
              <meta name="robots" content="noindex" />
              <meta http-equiv="refresh" content="0; url=https://topographic.yahyapak.dev/" />
              <script>
                var p = location.pathname.replace(/^\/topographic\/?/, '/');
                location.replace('https://topographic.yahyapak.dev' + p + location.search + location.hash);
              </script>
            </head>
            <body>
              <p>topographic has moved to <a href="https://topographic.yahyapak.dev/">topographic.yahyapak.dev</a>.</p>
            </body>
          </html>
          HTML
          cp site/index.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
